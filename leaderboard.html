<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Leaderboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body{
      background: linear-gradient(135deg, #f5f7ff, #eef2ff);
      font-family: system-ui;
    }

    .title {
      text-align: center;
      font-weight: 800;
      font-size: 2rem;
      margin-bottom: 30px;
      color: #1f2937;
    }

    .podium-container{
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 40px;
    }

    .podium {
      width: 220px;
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      transition: transform .2s;
    }

    .podium:hover{
      transform: translateY(-5px);
    }

    .first {
      background: linear-gradient(135deg, #fff3b0, #ffd60a);
      height: 260px;
    }

    .second {
      background: linear-gradient(135deg, #e5e7eb, #cbd5e1);
      height: 220px;
    }

    .third {
      background: linear-gradient(135deg, #ffd6a5, #ffb703);
      height: 200px;
    }

    .rank {
      font-size: 1.5rem;
      font-weight: 800;
    }

    .name {
      font-weight: 700;
      margin-top: 10px;
    }

    .points {
      font-size: 1.1rem;
      font-weight: 800;
      margin-top: 5px;
    }

    .list-card{
      background: white;
      border-radius: 16px;
      padding: 15px 20px;
      margin: 10px auto;
      max-width: 650px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .small-rank{
      font-weight: 700;
      color: #6b7280;
      transition: all 0.2s ease;
    }

    .list-card span,
    .list-card strong{
      transition: all 0.2s ease;
    }

    /* ✨ HOVER EFECTO */
    .list-card:hover{
      transform: translateY(-6px) scale(1.01);
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
      background: linear-gradient(135deg, #ffffff, #f9fbff);
    }

    .list-card:hover .small-rank{
      color: #2563eb;
      transform: scale(1.2);
    }

    .list-card:hover span:nth-child(2){
      font-weight: 700;
    }

    .list-card:hover strong{
      color: #16a34a;
      letter-spacing: 1px;
      transform: scale(1.1);
    }

  </style>
</head>

<body>

<div class="container py-5">

  <div class="title">🏆 Salón de la Gloria</div>

  <!-- PODIO VISUAL -->
  <div class="podium-container">

    <div class="podium second">
      <div class="rank">2 🥈</div>
      <div class="name">Miguel Santos</div>
      <div class="points">9.410 pts</div>
    </div>

    <div class="podium first">
      <div class="rank">1 🥇</div>
      <div class="name">Mateo Rivas</div>
      <div class="points">9.820 pts</div>
    </div>

    <div class="podium third">
      <div class="rank">3 🥉</div>
      <div class="name">Felisa Ortega</div>
      <div class="points">9.150 pts</div>
    </div>

  </div>

  <!-- RESTO -->
  <div class="list-card">
    <span class="small-rank">4</span>
    <span>Javier Molina</span>
    <strong>8.740 pts</strong>
  </div>

  <div class="list-card">
    <span class="small-rank">5</span>
    <span>Lucía Navarro</span>
    <strong>8.610 pts</strong>
  </div>

  <div class="list-card">
    <span class="small-rank">6</span>
    <span>Diego Herrera</span>
    <strong>8.420 pts</strong>
  </div>

  <div class="list-card">
    <span class="small-rank">7</span>
    <span>Elena Vargas</span>
    <strong>8.210 pts</strong>
  </div>

  <div class="list-card">
    <span class="small-rank">8</span>
    <span>Andrés Cruz</span>
    <strong>7.980 pts</strong>
  </div>

</div>

</body>
</html>
