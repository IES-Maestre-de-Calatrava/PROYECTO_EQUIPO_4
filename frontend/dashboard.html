<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel - Gramática Francesa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap (opcional, pero recomendado para el menú) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row flex-nowrap">
            
            <!-- Menú Lateral (Sidebar) -->
            <div class="col-auto col-md-3 col-xl-2 px-sm-2 px-0 bg-dark min-vh-100">
                <div class="d-flex flex-column align-items-center align-items-sm-start px-3 pt-4 text-white">
                    <span class="fs-5 d-none d-sm-inline mb-4 fw-bold">Gramática FR</span>
                    <ul class="nav nav-pills flex-column mb-sm-auto mb-0 align-items-center align-items-sm-start w-100" id="menu">
                        <li class="nav-item w-100 mb-2">
                            <a href="#" class="nav-link text-white active" aria-current="page">
                                <i class="bi bi-journal-text"></i> <span class="ms-1 d-none d-sm-inline">Actividades</span>
                            </a>
                        </li>
                        <li class="nav-item w-100 mb-2">
                            <a href="#" class="nav-link text-white">
                                <i class="bi bi-book"></i> <span class="ms-1 d-none d-sm-inline">Apuntes</span>
                            </a>
                        </li>
                        <li class="nav-item w-100 mb-2">
                            <a href="#" class="nav-link text-white">
                                <i class="bi bi-trophy"></i> <span class="ms-1 d-none d-sm-inline">Leaderboard</span>
                            </a>
                        </li>
                    </ul>
                    <hr class="w-100 text-secondary">
                    <div class="dropdown pb-4">
                        <a href="#" class="d-flex align-items-center text-white text-decoration-none">
                            <i class="bi bi-person-circle fs-4"></i>
                            <span class="d-none d-sm-inline mx-1">Mi Perfil</span>
                        </a>
                    </div>
                </div>
            </div>

            <!-- Contenido Principal -->
            <div class="col py-4 px-4 bg-light">
                <h2>Actividades - Passé Composé</h2>
                <hr>
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <h5>Ejercicio 1: Verbos auxiliares</h5>
                        <p>Completa las oraciones usando <em>être</em> o <em>avoir</em> según corresponda.</p>
                        <button class="btn btn-primary">Comenzar</button>
                    </div>
                </div>

                <!-- Aquí puedes ir cambiando el contenido dependiendo de si hacen clic en Apuntes o Leaderboard -->
            </div>
            
        </div>
    </div>
</body>
</html>
