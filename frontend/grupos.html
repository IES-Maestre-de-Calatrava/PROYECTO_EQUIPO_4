<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Selección de Grupo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-center mb-5">Selecciona tu Grupo de Estudio</h2>
        <div class="row g-4 justify-content-center">
            
            <!-- Grupo 1 -->
            <div class="col-md-4">
                <div class="card h-100 shadow-sm text-center">
                    <div class="card-body">
                        <h3 class="card-title text-primary">Nivel A1</h3>
                        <p class="card-text">Principiantes. Bases de gramática, vocabulario inicial y pronunciación.</p>
                        <a href="dashboard.html" class="btn btn-outline-primary">Entrar al Grupo</a>
                    </div>
                </div>
            </div>

            <!-- Grupo 2 -->
            <div class="col-md-4">
                <div class="card h-100 shadow-sm text-center">
                    <div class="card-body">
                        <h3 class="card-title text-success">Nivel A2</h3>
                        <p class="card-text">Intermedio bajo. Tiempos verbales del pasado y estructuras compuestas.</p>
                        <a href="dashboard.html" class="btn btn-outline-success">Entrar al Grupo</a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
