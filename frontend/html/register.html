<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Le Français — Registrarse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link rel="icon" type="image/png" href="https://static.vecteezy.com/system/resources/previews/012/624/939/non_2x/france-flag-icon-free-png.png"/>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body class="login-bg">

<div id="screen-register" class="screen active d-flex align-items-center justify-content-center">
  <div class="login-card">
<button
      id="login-dark-btn"
      onclick="toggleLoginDarkMode()"
      title="Modo oscuro"
      style="position:absolute;top:1.1rem;right:1.1rem;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border);background:var(--bg);color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;transition:all .25s ease;z-index:10;"
    ><i class="bi bi-moon-fill"></i></button>
    <div class="login-logo">
      Le <span style="color:#002654">Fr</span><span style="color:#6c757d">anç</span><span style="color:#ED2939">ais</span>
    </div>
    <div class="login-subtitle">Crea tu cuenta de alumno · v3.0</div>

    <div id="reg-error" class="alert py-2 px-3 d-none" style="font-size:.85rem;border-radius:8px;"></div>

    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input id="reg-nombre" type="text" class="form-control" placeholder="Tu nombre"/>
    </div>

    <div class="mb-3">
      <label class="form-label">Apellidos</label>
      <input id="reg-apellidos" type="text" class="form-control" placeholder="Tus apellidos"/>
    </div>

    <div class="mb-3">
      <label class="form-label">Correo electrónico</label>
      <input id="reg-correo" type="email" class="form-control" placeholder="tu@email.com" autocomplete="email"/>
    </div>

    <div class="mb-3">
      <label class="form-label">Contraseña</label>
      <input id="reg-contrasena" type="password" class="form-control" placeholder="••••••••"/>
    </div>

    <div class="mb-3">
      <label class="form-label">Confirmar contraseña</label>
      <input id="reg-confirmar" type="password" class="form-control" placeholder="••••••••"
             onkeydown="if(event.key==='Enter') doRegister()"/>
    </div>

    <button class="btn-login" onclick="doRegister()">Crear cuenta →</button>

    <div style="text-align:center;margin-top:.85rem;font-size:.83rem;color:var(--text-muted);">
      ¿Ya tienes cuenta?
      <a href="login.html" style="color:var(--primary);font-weight:600;text-decoration:none;">Inicia sesión →</a>
    </div>

  </div>
</div>
<script>
  // Inicializar dark mode en la página de login
  (function() {
    const isDark = localStorage.getItem('lf_darkmode') === '1';
    if (isDark) document.body.classList.add('dark-mode');
    document.addEventListener('DOMContentLoaded', function() {
      const btn = document.getElementById('login-dark-btn');
      if (!btn) return;
      btn.innerHTML = isDark ? '<i class="bi bi-sun-fill"></i>' : '<i class="bi bi-moon-fill"></i>';
      btn.title = isDark ? 'Modo claro' : 'Modo oscuro';
    });
  })();

  function toggleLoginDarkMode() {
    const isDark = document.body.classList.toggle('dark-mode');
    localStorage.setItem('lf_darkmode', isDark ? '1' : '0');
    const btn = document.getElementById('login-dark-btn');
    btn.innerHTML = isDark ? '<i class="bi bi-sun-fill"></i>' : '<i class="bi bi-moon-fill"></i>';
    btn.title = isDark ? 'Modo claro' : 'Modo oscuro';
  }
</script>
<script src="../js/script.js"></script>

</body>
