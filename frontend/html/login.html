<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <title>Document</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="screen-login" class="screen active">
  <div class="login-card">
    <div class="login-logo">Le <span style="color:#002654">Fr</span><span style="color:#6c757d">anç</span><span style="color:#ED2939">ais</span></div>
    <div class="login-subtitle">Tu plataforma SaaS para dominar el idioma · v3.0</div>

    <div id="login-error" class="alert alert-danger py-2 px-3 d-none" style="font-size:.85rem;border-radius:8px;"></div>

    <div class="mb-3">
      <label class="form-label">Correo electrónico</label>
      <input id="login-email" type="email" class="form-control" placeholder="tu@email.com"/>
    </div>
    <div class="mb-3">
      <label class="form-label">Contraseña</label>
      <input id="login-password" type="password" class="form-control" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <div class="mb-3">
      <label class="form-label d-block mb-2">Acceder como</label>
      <div class="d-flex gap-2 flex-wrap">
        <button class="role-badge active" id="role-alumno"   onclick="selectRole('alumno')"><i class="bi bi-person-fill"></i> Alumno</button>
        <button class="role-badge"        id="role-profesor" onclick="selectRole('profesor')"><i class="bi bi-person-video3"></i> Profesor</button>
        <!-- Rol director: badge oculto, se muestra automáticamente si el email coincide -->
        <button class="role-badge d-none" id="role-director" onclick="selectRole('director')"><i class="bi bi-shield-fill"></i> Director</button>
      </div>
    </div>
    <label class="remember-me mb-3">
      <input type="checkbox" id="remember-me" checked/> Recordar sesión
    </label>
    <button class="btn-login" onclick="doLogin()">Iniciar sesión →</button>
  </div>
</div>
<script src="../js/script.js"></script>
</body>
</html>
