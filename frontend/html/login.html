<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Le Français — Iniciar sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link rel="icon" type="image/png" href="https://static.vecteezy.com/system/resources/previews/012/624/939/non_2x/france-flag-icon-free-png.png"/>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>

<div id="screen-login" class="screen active">
  <div class="login-card">

    <div class="login-logo">
      Le <span style="color:#002654">Fr</span><span style="color:#6c757d">anç</span><span style="color:#ED2939">ais</span>
    </div>
    <div class="login-subtitle">Tu plataforma para dominar el francés · v3.0</div>

    <div id="login-error" class="alert alert-danger py-2 px-3 d-none" style="font-size:.85rem;border-radius:8px;"></div>

    <div class="mb-3">
      <label class="form-label">Correo electrónico</label>
      <input id="login-email" type="email" class="form-control" placeholder="tu@email.com" autocomplete="email"/>
    </div>

    <div class="mb-3">
      <label class="form-label">Contraseña</label>
      <input id="login-password" type="password" class="form-control" placeholder="••••••••"
             autocomplete="current-password"
             onkeydown="if(event.key==='Enter') doLogin()"/>
    </div>

    <label class="remember-me mb-3">
      <input type="checkbox" id="remember-me" checked/> Recordar sesión
    </label>
    <!-- Este elemento ya existe en tu código de source: 2 -->
<div id="login-error" class="alert alert-danger py-2 px-3 d-none" style="font-size:.85rem;border-radius:8px;"></div>
    <button class="btn-login" onclick="doLogin()">Iniciar sesión →</button>

    <div style="text-align:center;margin-top:.85rem;font-size:.83rem;color:var(--text-muted);">
      ¿No tienes cuenta?
      <a href="register.html" style="color:var(--primary);font-weight:600;text-decoration:none;">Regístrate como alumno →</a>
    </div>

  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/Login.js"></script>
<script src="../js/script.js"></script>

</body>
</html>
