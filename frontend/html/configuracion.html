<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <title>Configuración</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- ── CONFIGURACIÓN (todos los roles) ── -->
      <div id="settings" class="panel">
        <div class="section-title">⚙️ Configuración</div>

        <div class="settings-card">
          <div class="settings-card-header"><i class="bi bi-palette-fill me-2"></i>Apariencia</div>
          <div class="settings-row">
            <div>
              <div class="settings-row-label">Modo oscuro</div>
              <div class="settings-row-desc">Cambia el tema de la interfaz a oscuro</div>
            </div>
            <label class="toggle-switch">
              <input type="checkbox" id="dark-mode-toggle" onchange="toggleDarkMode(this.checked)"/>
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>

        <div class="settings-card">
          <div class="settings-card-header"><i class="bi bi-shield-lock-fill me-2"></i>Seguridad</div>
          <div class="settings-body">
            <div class="mb-3">
              <label class="form-label">Contraseña actual</label>
              <input type="password" class="form-control" id="settings-pass-current" placeholder="••••••••"/>
            </div>
            <div class="mb-3">
              <label class="form-label">Nueva contraseña</label>
              <input type="password" class="form-control" id="settings-pass-new" placeholder="Mínimo 8 caracteres"/>
            </div>
            <div class="mb-3">
              <label class="form-label">Confirmar nueva contraseña</label>
              <input type="password" class="form-control" id="settings-pass-confirm" placeholder="Repite la contraseña"/>
            </div>
            <div id="settings-pass-msg" class="d-none mb-3 alert py-2 px-3" style="font-size:.85rem;border-radius:8px;"></div>
            <button class="btn-primary-custom" onclick="changePassword()"><i class="bi bi-lock-fill me-1"></i>Actualizar contraseña</button>
            <div class="mt-2" style="font-size:.75rem;color:var(--text-muted);">
              <i class="bi bi-info-circle me-1"></i>El cambio se conectará al backend en producción.
            </div>
          </div>
        </div>

        <div class="settings-card">
          <div class="settings-card-header"><i class="bi bi-person-circle me-2"></i>Sesión</div>
          <div class="settings-row">
            <div>
              <div class="settings-row-label">Cerrar sesión</div>
              <div class="settings-row-desc">Salir de la aplicación de forma segura</div>
            </div>
            <button class="btn btn-sm btn-outline-danger" style="border-radius:8px;" onclick="doLogout()">
              <i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión
            </button>
          </div>
        </div>
      </div>
      <script src="../js/script.js"></script>
</body>
</html>
